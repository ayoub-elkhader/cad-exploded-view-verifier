[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "exploded-view-verifier"
version = "0.1.0"
description = "Geometric verification and repair of exploded views of CAD (STEP) assemblies"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ayoub Elkhader" }]
requires-python = ">=3.10"
# pythonocc-core is distributed through conda-forge only; see environment.yml.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
llm = ["openai>=1.0"]
test = ["pytest>=7"]

[project.scripts]
exploded-view-verify = "exploded_view_verifier.cli:main"

[project.urls]
Repository = "https://github.com/ayoub-elkhader/cad-exploded-view-verifier"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
